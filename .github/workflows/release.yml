name: Release preparation and npm publication
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected package version"
        required: true
        type: string
      publish:
        description: "Publish publicly after environment approval"
        required: true
        default: false
        type: boolean
concurrency:
  group: npm-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(p.version!==process.env.EXPECTED_VERSION) process.exit(1)'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: npm audit --audit-level=high
      - run: npm run plugins
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-release-candidate
          path: |
            *.tgz
            plugins/
          retention-days: 14
  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_ENABLED == 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm install --global npm@11.5.1
      - run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(p.name!=="@alvintayzhenwei/parallax-effect-pro" || p.version!==process.env.EXPECTED_VERSION) process.exit(1)'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: npm audit --audit-level=high
      - run: npm pack --ignore-scripts
      - run: npm publish "alvintayzhenwei-parallax-effect-pro-${EXPECTED_VERSION}.tgz" --access public --ignore-scripts
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
      - run: npm view "@alvintayzhenwei/parallax-effect-pro@${EXPECTED_VERSION}" version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
